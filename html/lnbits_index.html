<template id="lnbits-dynamic-fields">
  <div v-if="formData">
    <div class="row q-mb-lg" v-for="o in options">
      <div class="col auto-width">
        <p v-if="o.options?.length" class="q-ml-xl">
          <span v-text="o.label || o.name"></span>
          <small v-if="o.description">
            (<span v-text="o.description"></span>)</small
          >
        </p>
        <lnbits-dynamic-fields
          v-if="o.options?.length"
          :options="o.options"
          v-model="formData[o.name]"
          @update:model-value="handleValueChanged"
          class="q-ml-xl"
        >
        </lnbits-dynamic-fields>
        <div v-else>
          <q-input
            v-if="o.type === 'number'"
            type="number"
            v-model="formData[o.name]"
            @update:model-value="handleValueChanged"
            :label="o.label || o.name"
            :hint="o.description"
            :rules="applyRules(o.required)"
            filled
            dense
          ></q-input>
          <q-input
            v-else-if="o.type === 'text'"
            type="textarea"
            rows="5"
            v-model="formData[o.name]"
            @update:model-value="handleValueChanged"
            :label="o.label || o.name"
            :hint="o.description"
            :rules="applyRules(o.required)"
            filled
            dense
          ></q-input>
          <q-input
            v-else-if="o.type === 'password'"
            v-model="formData[o.name]"
            @update:model-value="handleValueChanged"
            type="password"
            :label="o.label || o.name"
            :hint="o.description"
            :rules="applyRules(o.required)"
            filled
            dense
          ></q-input>
          <q-select
            v-else-if="o.type === 'select'"
            v-model="formData[o.name]"
            @update:model-value="handleValueChanged"
            :label="o.label || o.name"
            :hint="o.description"
            :options="o.values"
            :rules="applyRules(o.required)"
          ></q-select>
          <q-select
            v-else-if="o.isList"
            v-model.trim="formData[o.name]"
            @update:model-value="handleValueChanged"
            input-debounce="0"
            new-value-mode="add-unique"
            :label="o.label || o.name"
            :hint="o.description"
            :rules="applyRules(o.required)"
            filled
            multiple
            dense
            use-input
            use-chips
            hide-dropdown-icon
          ></q-select>
          <div v-else-if="o.type === 'bool'">
            <q-item tag="label" v-ripple>
              <q-item-section avatar top>
                <q-checkbox
                  v-model="formData[o.name]"
                  @update:model-value="handleValueChanged"
                />
              </q-item-section>
              <q-item-section>
                <q-item-label
                  ><span v-text="o.label || o.name"></span
                ></q-item-label>
                <q-item-label caption>
                  <span v-text="o.description"></span>
                </q-item-label>
              </q-item-section>
            </q-item>
          </div>
          <q-input
            v-else-if="o.type === 'hidden'"
            v-model="formData[o.name]"
            type="text"
            style="display: none"
            :rules="applyRules(o.required)"
          ></q-input>
          <div v-else-if="o.type === 'chips'">
            <lnbits-dynamic-chips
              v-model="formData[o.name]"
              @update:model-value="handleValueChanged"
            ></lnbits-dynamic-chips>
          </div>
          <q-input
            v-else
            v-model="formData[o.name]"
            @update:model-value="handleValueChanged"
            :hint="o.description"
            :label="o.label || o.name"
            :rules="applyRules(o.required)"
            filled
            dense
          ></q-input>
        </div>
      </div>
    </div>
  </div>
</template>

            <div class="col-8 q-pl-md" v-if="parse.lnurlpay.commentAllowed > 0">
              <q-input
                filled
                dense
                v-model="parse.data.comment"
                :type="
                  parse.lnurlpay.commentAllowed > 512 ? 'textarea' : 'text'
                "
                label="Comment (optional)"
                :maxlength="parse.lnurlpay.commentAllowed"
                ><template
                  v-if="parse.data.internalMemo === null"
                  v-slot:append
                >
                  <q-icon
                    name="add_comment"
                    @click.stop.prevent="parse.data.internalMemo = ''"
                    class="cursor-pointer"
                  ></q-icon>
                  <q-tooltip>
                    <span v-text="$t('internal_memo')"></span>
                  </q-tooltip> </template
              ></q-input>
              <br />
              <q-input
                v-if="parse.data.internalMemo !== null"
                autogrow
                filled
                dense
                v-model="parse.data.internalMemo"
                :label="$t('internal_memo')"
                :hint="$t('internal_memo_hint_pay')"
                class=""
                :rules="[
                  val =>
                    !val ||
                    val.length <= 512 ||
                    'Please use maximum 512 characters'
                ]"
                ><template v-slot:append>
                  <q-icon
                    name="cancel"
                    @click.stop.prevent="parse.data.internalMemo = null"
                    class="cursor-pointer"
                  /> </template
              ></q-input>
            </div>
          </div>
          <div class="row q-mt-lg">
            <q-btn unelevated color="primary" type="submit">Send</q-btn>
            <q-btn
              :label="$t('cancel')"
              v-close-popup
              flat
              color="grey"
              class="q-ml-auto"
            ></q-btn>
          </div>
        </q-form>
      </div>
      <div v-else>
        <q-form
          v-if="!parse.camera.show"
          @submit="decodeRequest"
          class="q-gutter-md"
        >
          <q-input
            filled
            dense
            v-model.trim="parse.data.request"
            type="textarea"
            :label="$t('paste_invoice_label')"
            ref="textArea"
          >
          </q-input>
          <div class="row q-mt-lg">
            <q-btn
              unelevated
              color="primary"
              :disable="parse.data.request == ''"
              type="submit"
              :label="$t('read')"
            ></q-btn>
            <q-icon
              name="content_paste"
              color="grey"
              class="q-mt-xs q-ml-sm q-mr-auto"
              v-if="parse.copy.show"
              @click="pasteToTextArea"
            >
              <q-tooltip>
                <span v-text="$t('paste_from_clipboard')"></span>
              </q-tooltip>
            </q-icon>
            <q-btn
              v-close-popup
              flat
              color="grey"
              class="q-ml-auto"
              :label="$t('cancel')"
            ></q-btn>
          </div>
        </q-form>
        <div v-else>
          <q-responsive :ratio="1">
            <qrcode-stream
              @detect="decodeQR"
              @camera-on="onInitQR"
              class="rounded-borders"
            ></qrcode-stream>
          </q-responsive>
          <div class="row q-mt-lg">
            <q-btn
              :label="$t('cancel')"
              @click="closeCamera"
              flat
              color="grey"
              class="q-ml-auto"
            >
            </q-btn>
          </div>
        </div>
      </div>
    </q-card>
  </q-dialog>

  <div
    class="lt-md fixed-bottom left-0 right-0 bg-primary text-white shadow-2 z-top"
  >
    <q-tabs active-class="px-0" indicator-color="transparent" align="justify">
      <q-tab
        icon="file_download"
        @click="showReceiveDialog"
        :label="$t('receive')"
      >
      </q-tab>

      <q-tab @click="showParseDialog" icon="file_upload" :label="$t('send')">
      </q-tab>
    </q-tabs>

    <q-btn
      @click="g.scanner = decodeQR"
      round
      unelevated
      size="35px"
      icon="qr_code_scanner"
      class="text-white bg-primary z-top vertical-bottom absolute-center absolute"
    >
    </q-btn>
  </div>
